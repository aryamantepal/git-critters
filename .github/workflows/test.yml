name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The committed Action bundle is up to date
        run: git diff --exit-code dist/

  # Run the Action for real on a throwaway branch: it draws, edits the README and pushes.
  action:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Start a throwaway branch with a README to add to
        run: |
          branch="action-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          git switch -c "$branch"
          printf '# Hello\n\nMy existing text.\n' > README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --all --message "A README to add to"
          git push --quiet --set-upstream origin "$branch"

      - uses: ./
        with:
          critter: ghost
          colour: mint
      - name: It committed a GIF and a README that keeps the existing text
        run: |
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")"
          git log -1 --format=%s | grep -qx "critter: draw the mint ghost"
          head -c 6 critter.gif | grep -q GIF89a
          test "$(grep -c 'git-critters:start' README.md)" = 1
          grep -q 'src="critter.gif"' README.md
          grep -q 'My existing text.' README.md
          git rev-parse HEAD > before
          git hash-object README.md > readme-before
          git hash-object critter.gif > gif-before

      - uses: ./
        with:
          critter: ghost
          colour: mint
      - name: Running it again changes nothing
        run: test "$(git rev-parse HEAD)" = "$(cat before)"

      - uses: ./
        with:
          critter: dragon
      - name: Swapping redraws the GIF but preserves the user-owned README block
        run: |
          git log -1 --format=%s | grep -qx "critter: draw the ember dragon"
          test "$(git hash-object critter.gif)" != "$(cat gif-before)"
          test "$(git hash-object README.md)" = "$(cat readme-before)"
          test "$(grep -c 'git-critters:start' README.md)" = 1

      - uses: ./
        with:
          critter: ghost
          activity: true
      - name: An activity run draws from the owner's real data, named for yesterday
        run: |
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")"
          git log -1 --format=%s | grep -Eqx "critter: draw the ghost for [0-9]{4}-[0-9]{2}-[0-9]{2}"
          head -c 6 critter.gif | grep -q GIF89a
          test "$(git hash-object README.md)" = "$(cat readme-before)"
          test "$(grep -c 'git-critters:start' README.md)" = 1
          grep -q 'My existing text.' README.md
          git rev-parse HEAD > before-activity

      - uses: ./
        with:
          critter: ghost
          activity: true
      - name: Running the activity again changes nothing
        run: test "$(git rev-parse HEAD)" = "$(cat before-activity)"

      # The owner has plenty of contributions since test.yml was first committed, so a surprise hatches.
      - uses: ./
        with:
          critter: surprise
          activity: true
      - name: A surprise hatches into a critter without rewriting the README block
        run: |
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")"
          git log -1 --format=%s | grep -Eqx "critter: draw the (dragon|axolotl|jellyfish|ghost) for [0-9]{4}-[0-9]{2}-[0-9]{2}"
          head -c 6 critter.gif | grep -q GIF89a
          test "$(git hash-object README.md)" = "$(cat readme-before)"
          test "$(grep -c 'git-critters:start' README.md)" = 1
          grep -q 'My existing text.' README.md

      # An organization has no activity to read, so this is the failed read: no GIF at this path yet means an egg.
      - uses: ./
        with:
          critter: dragon
          egg: true
          activity: true
          login: github
          output: egg/critter.gif
      - name: A new egg path is drawn without rewriting the user-owned README block
        run: |
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")"
          git log -1 --format=%s | grep -Eqx "critter: draw the egg for [0-9]{4}-[0-9]{2}-[0-9]{2}"
          head -c 6 egg/critter.gif | grep -q GIF89a
          test "$(git hash-object README.md)" = "$(cat readme-before)"
          test "$(grep -c 'git-critters:start' README.md)" = 1
          grep -q 'src="critter.gif"' README.md

      - name: egg without activity fails with a clear message
        id: egg-off
        continue-on-error: true
        uses: ./
        with:
          critter: dragon
          egg: true
      - run: test "${{ steps.egg-off.outcome }}" = failure

      - name: surprise without activity fails with a clear message
        id: surprise-off
        continue-on-error: true
        uses: ./
        with:
          critter: surprise
      - run: test "${{ steps.surprise-off.outcome }}" = failure

      - name: surprise with a fixed colour fails with a clear message
        id: surprise-fixed
        continue-on-error: true
        uses: ./
        with:
          critter: surprise
          colour: ember
          activity: true
      - run: test "${{ steps.surprise-fixed.outcome }}" = failure

      - name: colour languages without activity fails with a clear message
        id: languages-off
        continue-on-error: true
        uses: ./
        with:
          critter: ghost
          colour: languages
      - run: test "${{ steps.languages-off.outcome }}" = failure

      - name: An unknown critter fails with a clear message
        id: unknown
        continue-on-error: true
        uses: ./
        with:
          critter: unicorn
      - run: test "${{ steps.unknown.outcome }}" = failure

      - name: Remove the throwaway branch
        if: always()
        run: git push --quiet origin --delete "$BRANCH" || true
