name: 💡 Feature Request
description: Suggest an enhancement or new feature for the action or preview site
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for git-critters? Let us know!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What feature would you like to see?
      placeholder: Describe the feature and why it would be useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
    validations:
      required: false
