name: git-critters
description: Draw a pixel-art critter as a looping GIF and add it to your profile README.
branding:
  icon: feather
  color: orange

inputs:
  critter:
    description: >-
      Optional legacy override for the critter to draw. Leave it out to start from an egg that
      hatches into the critter chosen from the login. Existing named values and "surprise"
      remain supported for backwards compatibility: dragon, axolotl, jellyfish, ghost, robot,
      cat, frog, mushroom, turtle and bat.
    required: false
    default: ""
  colour:
    description: >-
      Which colourway to use, or "languages" to colour it from your most-used languages
      (needs activity). Leave this out for the critter's first colourway, or for languages
      when activity is on.
    default: ""
  output:
    description: Where to save the GIF, relative to the repository's root.
    default: critter.gif
  activity:
    description: >-
      Draw the critter from your public GitHub activity and redraw it each night: size from
      lifetime contributions, marks from your longest streak this year, motion from yesterday.
    default: "false"
  egg:
    description: >-
      Start as an egg that hatches into the critter after 25 contributions since you added the
      workflow. Needs activity.
    default: "false"
  login:
    description: Whose activity to draw from. Only used when activity is true.
    default: ${{ github.repository_owner }}
  token:
    description: The token used to read contributions and repositories. Only used when activity is true.
    default: ${{ github.token }}

runs:
  using: node24
  main: dist/action.cjs
